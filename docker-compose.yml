services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
    volumes:
      - ./server/src:/app/src
      - ./server/test:/app/test

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      API_URL: http://server:4000
      POLLING: "1"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.ts:/app/vite.config.ts
    depends_on:
      - server
